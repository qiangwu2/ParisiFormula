name: build

on:
  push:
  pull_request:

# Both jobs run `lake build` themselves (instead of letting lean-action do it) so that the
# Lean error messages can be written to the run's Summary page and as annotations.
# Those are visible to anyone on the public run page, without downloading logs.

jobs:
  # The supporting library must build and contain no source placeholders.
  verified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build ParisiFormula and report Lean errors
        shell: bash
        run: |
          set +e
          lake build ParisiFormula 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          python3 - build.log "ParisiFormula" "$status" <<'PYEOF'
          import re, sys, os
          log = open(sys.argv[1], errors="replace").read().splitlines()
          title = sys.argv[2]
          status = int(sys.argv[3])
          pat = re.compile(r"^error: ([^:\s]+\.lean):(\d+):(\d+): (.*)$")
          stop = ("error:", "warning:", "info:", "✔", "✖", "⚠", "Build completed", "Some required")
          errs, i = [], 0
          while i < len(log):
              m = pat.match(log[i])
              if m:
                  block, j = [log[i]], i + 1
                  while j < len(log) and not log[j].startswith(stop) and len(block) < 25:
                      block.append(log[j]); j += 1
                  errs.append((m.group(1), m.group(2), m.group(3), block)); i = j
              else:
                  i += 1
          out = [f"## {title}: {'FAILED' if status else 'OK'} - {len(errs)} Lean error(s)", ""]
          for f, l, c, b in errs[:30]:
              out += [f"### `{f}:{l}:{c}`", "```"] + b + ["```", ""]
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              open(summ, "a").write("\n".join(out) + "\n")
          for f, l, c, b in errs[:10]:
              msg = "%0A".join(x.replace("%", "%25") for x in b)
              print(f"::error file={f},line={l},col={c}::{msg}")
          PYEOF
          exit $status
      - name: Reject sorry / admit / axiom in ParisiFormula
        # `always()`: run the placeholder scan even when the build step failed, so a red
        # build never hides a `sorry` that slipped into the supporting library.
        if: always()
        run: |
          if grep -rnE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' --include='*.lean' ParisiFormula; then
            echo "::error::placeholder or project-local axiom found in ParisiFormula/"
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              exit "$scan_status"
            fi
          fi

  # Open targets may warn about `sorry`, but build/axiom-audit failures must fail CI.
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build Targets and axiom guards and report Lean errors
        shell: bash
        run: |
          set +e
          lake build Targets 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          python3 - build.log "Targets (including GuerraAudit)" "$status" <<'PYEOF'
          import re, sys, os
          log = open(sys.argv[1], errors="replace").read().splitlines()
          title = sys.argv[2]
          status = int(sys.argv[3])
          pat = re.compile(r"^error: ([^:\s]+\.lean):(\d+):(\d+): (.*)$")
          stop = ("error:", "warning:", "info:", "✔", "✖", "⚠", "Build completed", "Some required")
          errs, i = [], 0
          while i < len(log):
              m = pat.match(log[i])
              if m:
                  block, j = [log[i]], i + 1
                  while j < len(log) and not log[j].startswith(stop) and len(block) < 25:
                      block.append(log[j]); j += 1
                  errs.append((m.group(1), m.group(2), m.group(3), block)); i = j
              else:
                  i += 1
          out = [f"## {title}: {'FAILED' if status else 'OK'} - {len(errs)} Lean error(s)", ""]
          for f, l, c, b in errs[:30]:
              out += [f"### `{f}:{l}:{c}`", "```"] + b + ["```", ""]
          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              open(summ, "a").write("\n".join(out) + "\n")
          for f, l, c, b in errs[:10]:
              msg = "%0A".join(x.replace("%", "%25") for x in b)
              print(f"::error file={f},line={l},col={c}::{msg}")
          PYEOF
          exit $status
